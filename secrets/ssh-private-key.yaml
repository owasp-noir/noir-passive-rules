---
id: ssh-private-key
info:
  name: Detect SSH_PRIVATE_KEY
  author: [owasp noir team]
  severity: critical
  description: Detects the presence of SSH private keys in the code
  reference: ['https://www.ssh.com/academy/ssh-keys']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '-----BEGIN (?:OPENSSH|RSA|DSA|EC) PRIVATE KEY-----'
    condition: or
category: secret
techs: ['*']
