---
id: grafana-token
info:
  name: Detect Grafana Token
  author: [owasp noir team]
  severity: critical
  description: Detects Grafana service account and Grafana Cloud tokens
  reference: ['https://grafana.com/docs/grafana/latest/administration/service-accounts/']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\bglsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8}\b'
      - '\bglc_[A-Za-z0-9+/]{32,}={0,2}'
    condition: or
category: secret
techs: ['*']
