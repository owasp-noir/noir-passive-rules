---
id: azure-sas-token
info:
  name: Detect Azure SAS Token
  author: [owasp noir team]
  severity: high
  description: Detects Azure Storage shared access signature (SAS) URLs and query strings
  reference: ['https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\bsv=\d{4}-\d{2}-\d{2}&[^\s\''"]*\bsig=[A-Za-z0-9%+/]{30,}'
    condition: or
category: secret
techs: ['*']
