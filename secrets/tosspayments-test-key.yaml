---
id: tosspayments-test-key
info:
  name: Detect Toss Payments Test Secret Key
  author: [owasp noir team]
  severity: low
  description: Detects Toss Payments test-mode secret keys
  reference: ['https://docs.tosspayments.com/reference/using-api/api-keys']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\btest_g?sk_(?:docs_)?[0-9a-zA-Z]{20,}'
    condition: or
category: secret
techs: ['*']
