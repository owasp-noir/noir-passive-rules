---
id: ssh-rsa-key
info:
  name: Detect SSH_RSA_KEY
  author: [owasp noir team]
  severity: low
  description: Detects SSH RSA public keys (not secret on their own; may reveal
    trusted keys or infrastructure)
  reference: ['https://datatracker.ietf.org/doc/html/rfc4253#section-6.6']
matchers-condition: or
matchers:
  - type: regex
    patterns: ['ssh-rsa\s+[A-Za-z0-9+/=]{100,}']
    condition: or
category: secret
techs: ['*']
