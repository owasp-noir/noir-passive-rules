---
id: jwt-token
info:
  name: Detect JSON Web Token
  author: [owasp noir team]
  severity: medium
  description: Detects JSON Web Tokens (JWT); signed session or API tokens may grant access until they expire
  reference: ['https://datatracker.ietf.org/doc/html/rfc7519']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
    condition: or
category: secret
techs: ['*']
