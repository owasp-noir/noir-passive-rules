---
id: naver-clova-studio-api-key
info:
  name: Detect NAVER Cloud CLOVA Studio API Key
  author: [junghyunkim329]
  severity: critical
  description: Detects nv-prefixed API keys assigned to CLOVASTUDIO_API_KEY
  reference:
    - https://api.ncloud-docs.com/docs/ai-naver-clovastudio-summary
    - https://guide.ncloud-docs.com/docs/clovastudio-dev-langchain
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\A[ \t]*(?:export[ \t]+)?CLOVASTUDIO_API_KEY[ \t]*=[ \t]*(["'']?)nv-[._~+/-]*[A-Za-z0-9][A-Za-z0-9._~+/-]*=*\1(?:[ \t]+(?:#.*)?)?\r?\z'
    condition: or
category: secret
techs: ['*']
