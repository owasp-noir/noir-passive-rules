---
id: pypi-token
info:
  name: Detect PyPI Token
  author: [owasp noir team]
  severity: critical
  description: Detects PyPI API tokens, which allow publishing packages
  reference: ['https://pypi.org/help/#apitoken']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,}'
    condition: or
category: secret
techs: ['*']
