---
id: azure-ad-client-secret
info:
  name: Detect Azure AD Client Secret
  author: [owasp noir team]
  severity: critical
  description: Detects Microsoft Entra ID (Azure AD) application client secrets
  reference: ['https://learn.microsoft.com/en-us/entra/identity-platform/how-to-add-credentials']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '(?<![A-Za-z0-9_~.-])[A-Za-z0-9_~.]{3}\dQ~[A-Za-z0-9_~.-]{31,34}(?![A-Za-z0-9_~.-])'
    condition: or
category: secret
techs: ['*']
