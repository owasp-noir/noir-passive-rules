---
id: twilio-api-key
info:
  name: Detect TWILIO_API_KEY
  author: [owasp noir team]
  severity: high
  description: Detects Twilio API Key SIDs and auth token variables that allow
    sending messages and incurring charges
  reference: ['https://www.twilio.com/docs/iam/api-keys']
matchers-condition: or
matchers:
  - type: word
    patterns: [TWILIO_AUTH_TOKEN, TWILIO_API_KEY]
    condition: or
  - type: regex
    patterns:
      - '\bSK[0-9a-fA-F]{32}\b'
    condition: or
category: secret
techs: ['*']
