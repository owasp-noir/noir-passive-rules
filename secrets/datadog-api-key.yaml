---
id: datadog-api-key
info:
  name: Detect Datadog API Key
  author: [owasp noir team]
  severity: high
  description: Detects Datadog API and application keys assigned to their usual variable names
  reference: ['https://docs.datadoghq.com/account_management/api-app-keys/']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '(?i:\b(?:dd|datadog)_api_key)[\''"]?\s*[=:]\s*[\''"]?[0-9a-f]{32}\b'
      - '(?i:\b(?:dd|datadog)_app(?:lication)?_key)[\''"]?\s*[=:]\s*[\''"]?[0-9a-f]{40}\b'
    condition: or
category: secret
techs: ['*']
