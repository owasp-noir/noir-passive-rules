---
id: sentry-dsn
info:
  name: Detect Sentry DSN
  author: [owasp noir team]
  severity: medium
  description: Detects Sentry DSNs, which allow sending events to a Sentry project
  reference: ['https://docs.sentry.io/concepts/key-terms/dsn-explainer/']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - 'https://[0-9a-f]{32}@[a-z0-9.-]+\.sentry\.io/[0-9]+'
    condition: or
category: secret
techs: ['*']
