---
id: discord-bot-token
info:
  name: Detect Discord Bot Token
  author: [owasp noir team]
  severity: critical
  description: Detects Discord bot tokens
  reference: ['https://discord.com/developers/docs/reference#authentication']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\b[MNO][A-Za-z0-9_-]{23,25}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,38}\b'
    condition: or
category: secret
techs: ['*']
