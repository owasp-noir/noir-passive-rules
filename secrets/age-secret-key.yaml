---
id: age-secret-key
info:
  name: Detect age Secret Key
  author: [owasp noir team]
  severity: critical
  description: Detects age encryption secret keys
  reference: ['https://github.com/FiloSottile/age']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - 'AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}'
    condition: or
category: secret
techs: ['*']
