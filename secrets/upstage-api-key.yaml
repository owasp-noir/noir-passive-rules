---
id: upstage-api-key
info:
  name: Detect Upstage API Key
  author: [seodahyun814]
  severity: high
  description: Detects exposed Upstage API keys
  reference:
    - 'https://console.upstage.ai/api-keys'
    - 'https://docs.neurolink.ink/docs/getting-started/providers/upstage/'
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\bup_[A-Za-z0-9]{29}\b'
    condition: or
category: secret
techs: ['*']
