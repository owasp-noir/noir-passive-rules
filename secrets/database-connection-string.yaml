---
id: database-connection-string
info:
  name: Detect Database Connection String
  author: [owasp noir team]
  severity: high
  description: Detects database and message broker URLs with embedded
    credentials (PostgreSQL, MySQL/MariaDB, Redis, AMQP)
  reference: ['https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-CONNSTRING-URIS']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\b(?:postgres(?:ql)?|mysql2?|mariadb|rediss?|amqps?)://[^\s:/@''"]*:(?!\$\{)[^\s/@''"]+@[^\s/@''"]+'
    condition: or
category: secret
techs: ['*']
