---
id: private-key
info:
  name: Detect PRIVATE_KEY
  author: [owasp noir team]
  severity: critical
  description: Detects PEM/PGP private key blocks and private keys assigned as
    string literals
  reference: ['https://datatracker.ietf.org/doc/html/rfc7468']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '-----BEGIN (?:ENCRYPTED )?PRIVATE KEY-----'
      - '-----BEGIN PGP PRIVATE KEY BLOCK-----'
      - '\bPRIVATE_KEY\s*=\s*[''"][^''"\s$#{}]{16,}[''"]'
    condition: or
category: secret
techs: ['*']
