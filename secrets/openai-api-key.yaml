---
id: openai-api-key
info:
  name: Detect OpenAI API Key
  author: [owasp noir team]
  severity: critical
  description: Detects the presence of OpenAI API keys. OpenAI keys typically start
    with 'sk-', 'sk-proj-' or 'sk-svcacct-'.
  reference: ['https://platform.openai.com/docs/api-reference/authentication']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - 'sk-[a-zA-Z0-9]{48}'
      - 'sk-proj-[a-zA-Z0-9]{48}'
      - 'sk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,}T3BlbkFJ[A-Za-z0-9_-]{20,}'
    condition: or
  - type: word
    patterns: [OPENAI_API_KEY, OPENAI_TOKEN]
    condition: or
category: secret
techs: ['*']
