---
id: huggingface-token
info:
  name: Detect Hugging Face Token
  author: [owasp noir team]
  severity: critical
  description: Detects Hugging Face user access tokens
  reference: ['https://huggingface.co/docs/hub/security-tokens']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\bhf_[A-Za-z0-9]{34}\b'
    condition: or
category: secret
techs: ['*']
