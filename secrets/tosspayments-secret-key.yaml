---
id: tosspayments-secret-key
info:
  name: Detect Toss Payments Secret Key
  author: [owasp noir team]
  severity: critical
  description: Detects Toss Payments live secret keys, which can confirm, cancel and query real payments
  reference: ['https://docs.tosspayments.com/reference/using-api/api-keys']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\blive_g?sk_[0-9a-zA-Z]{20,}'
    condition: or
category: secret
techs: ['*']
