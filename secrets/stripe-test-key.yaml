---
id: stripe-test-key
info:
  name: Detect Stripe Test Key
  author: [owasp noir team]
  severity: low
  description: Detects Stripe test-mode secret and restricted keys
  reference: ['https://docs.stripe.com/keys']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\b[sr]k_test_[0-9a-zA-Z]{24,}'
    condition: or
category: secret
techs: ['*']
