---
id: webhook-slack
info:
  name: Detect SLACK_WEBHOOK
  author: [owasp noir team]
  severity: high
  description: Detects the presence of Slack webhook URLs in the code
  reference: [https://api.slack.com/messaging/webhooks]
matchers-condition: or
matchers:
  - type: word
    patterns: [https://hooks.slack.com/services/, https://hooks.slack.com/workflows/, https://hooks.slack.com/triggers/]
    condition: or
  - type: regex
    patterns:
      - 'https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8,}/B[a-zA-Z0-9_]{8,}/[a-zA-Z0-9_]{24}'
      - 'https://hooks\.slack\.com/(?:workflows|triggers)/T[A-Z0-9]{8,}/A[A-Z0-9]{8,}/[0-9]+/[A-Za-z0-9]{24,}'
    condition: or
category: secret
techs: ['*']
