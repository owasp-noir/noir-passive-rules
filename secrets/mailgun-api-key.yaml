---
id: mailgun-api-key
info:
  name: Detect Mailgun API Key
  author: [owasp noir team]
  severity: high
  description: Detects legacy Mailgun private API keys
  reference: ['https://documentation.mailgun.com/docs/mailgun/user-manual/get-started/']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\bkey-[0-9a-f]{32}\b'
    condition: or
category: secret
techs: ['*']
