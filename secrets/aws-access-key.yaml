---
id: aws-access-key
info:
  name: Detect AWS_ACCESS_KEY
  author: [owasp noir team]
  severity: critical
  description: Detects the presence of AWS Access Key ID and Secret Access Key in
    the code
  reference: ['https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html']
matchers-condition: or
matchers:
  - type: word
    patterns: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY]
    condition: or
  - type: regex
    patterns:
      - '(?i:aws_access_key_id)\s*[=:]\s*[''"]?(?:AKIA|ASIA)[0-9A-Z]{16}\b'
      - '(?i:aws_secret_access_key)\s*[=:]\s*[''"]?[A-Za-z0-9/+=]{40}(?![A-Za-z0-9/+=])'
      - '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    condition: or
category: secret
techs: ['*']
