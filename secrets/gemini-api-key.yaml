---
id: gemini-api-key
info:
  name: Detect Google API Key (Gemini, GCP)
  author: [owasp noir team]
  severity: critical
  description: Detects Google API keys (Gemini, Maps, Firebase and other GCP
    APIs). These keys start with 'AIzaSy'.
  reference: [https://ai.google.dev/docs/api_key]
matchers-condition: or
matchers:
  - type: regex
    patterns: ['AIzaSy[A-Za-z0-9\-_]{33}']
    condition: or
  - type: word
    patterns:
      - GEMINI_API_KEY
      - GOOGLE_AI_API_KEY
      - GOOGLE_GENERATIVE_AI_KEY
    condition: or
category: secret
techs: ['*']
