---
id: atlassian-token
info:
  name: Detect Atlassian API Token
  author: [owasp noir team]
  severity: critical
  description: Detects Atlassian (Jira, Confluence) API tokens
  reference: ['https://support.atlassian.com/atlassian-account/docs/manage-api-tokens-for-your-atlassian-account/']
matchers-condition: or
matchers:
  - type: regex
    patterns:
      - '\bATATT3[A-Za-z0-9_=-]{150,}'
    condition: or
category: secret
techs: ['*']
